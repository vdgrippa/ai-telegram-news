name: Daily AI News            # compare nel tab “Actions”

on:
  schedule:
    # 06:00 UTC = 08:00 Europe/Rome (ora legale)
    - cron:  '0 6 * * *'
  workflow_dispatch:           # avvio manuale

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
    # 1) checkout repo
    - uses: actions/checkout@v4

    # 2) Python 3.11 (stabile per openai + httpx pin)
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    # 3) install requirements
    - name: Install dependencies
      run: pip install -r requirements.txt

    # 4) invia il messaggio su Telegram (niente JSON)
    - name: Send digest to Telegram
      run: |
        python daily_ai_news.py           # fa solo Telegram
      env:
        TG_TOKEN:       ${{ secrets.TG_TOKEN }}
        TG_CHAT_ID:     ${{ secrets.TG_CHAT_ID }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    # 5) crea il JSON per WordPress
    - name: Generate digest JSON
      run: |
        python generate_digest.py > digest.json
        echo "EXTRACTS_JSON=$(cat digest.json | tr -d '\n')" >> "$GITHUB_ENV"
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    # 6) pubblica i 5 estratti su WordPress
    - name: Publish extracts to WordPress
      run: |
        pip install requests
        python wp_publish.py
      env:
        WP_URL_BASE:   ${{ secrets.WP_URL_BASE }}
        WP_USER:       ${{ secrets.WP_USER }}
        WP_APP_PASS:   ${{ secrets.WP_APP_PASS }}
        WP_CAT_ID:     "26"                       # ← ID categoria
        EXTRACTS_JSON: ${{ env.EXTRACTS_JSON }}



  