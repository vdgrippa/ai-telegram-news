name: Daily AI News            # nome visualizzato nel tab Actions

on:
  schedule:
    # ATTENZIONE – GitHub usa sempre il fuso UTC
    # 07:00 UTC = 09:00 Europe/Rome quando c’è l’ora legale
    # 08:00 UTC = 09:00 Europe/Rome in ora solare (ott-marzo)
    - cron:  '0 6 * * *'
  workflow_dispatch:           # pulsante “Run workflow” manuale

jobs:
  run:
    runs-on: ubuntu-latest     # runner Linux offerto da GitHub
    steps:
      - uses: actions/checkout@v4    # scarica il tuo repo

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'     # la stessa versione che usi in locale

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        run: python daily_ai_news.py
        env:
          TG_TOKEN:       ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID:     ${{ secrets.TG_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
